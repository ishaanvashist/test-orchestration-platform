services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: testorchestrationdb
      POSTGRES_USER: torchuser
      POSTGRES_PASSWORD: torchpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  postgres_data: