spring.application.name=test-orchestration-platform

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/testorchestrationdb
spring.datasource.username=torchuser
spring.datasource.password=torchpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6380

spring.cache.type=redis

management.endpoints.web.exposure.include=health,info,metrics

info.app.name=Test Orchestration Platform
info.app.description=Tracks test flakiness across CI pipelines
management.info.env.enabled=true
