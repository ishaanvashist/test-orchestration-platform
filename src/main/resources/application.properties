spring.application.name=test-orchestration-platform

server.port=8081

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/testorchestrationdb}
spring.datasource.username=${DATABASE_USERNAME:torchuser}
spring.datasource.password=${DATABASE_PASSWORD:torchpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.cache.type=redis

management.endpoints.web.exposure.include=health,info,metrics

info.app.name=Test Orchestration Platform
info.app.description=Tracks test flakiness across CI pipelines
management.info.env.enabled=true